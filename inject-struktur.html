<script>
/* ================================================================
   INJEKSI PRO v2 — Gambar Portal berdimensi + PDF export
   Ditambahkan pada Analisa Struktur Baja Warehouse (milik Ir. Mohamad Hartadi)
   - Panel GAMBAR PORTAL: notasi bentang, tinggi, sudut atap, panjang
   - Toggle Notasi Dimensi ON/OFF
   - Klik dimensi = edit → sinkron ke input & hasil (auto Hitung)
   - Tombol "Laporan PDF" di toolbar (print ke PDF)
   ================================================================ */
(function () {
  "use strict";

  /* ---------- CSS ---------- */
  const css = document.createElement("style");
  css.textContent = `
    .gp-wrap{position:fixed;right:14px;bottom:14px;z-index:9990;width:340px;max-width:calc(100vw - 28px);
      background:#fff;border:1px solid #dbe2ea;border-radius:12px;box-shadow:0 8px 30px rgba(15,23,42,.22);
      font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
    .gp-head{background:linear-gradient(135deg,#1f4e79,#2563eb);color:#fff;padding:8px 10px;display:flex;
      align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
    .gp-head b{font-size:12px;letter-spacing:.4px}
    .gp-head .gp-x{font-size:15px;line-height:1;opacity:.9;padding:0 4px}
    .gp-tools{display:flex;gap:6px;padding:7px 10px;border-bottom:1px solid #eef2f7;background:#f8fafc;flex-wrap:wrap}
    .gp-tools button{border:1px solid #cbd5e1;background:#fff;color:#1f4e79;font-size:10.5px;font-weight:700;
      padding:4px 9px;border-radius:7px;cursor:pointer}
    .gp-tools button.on{background:#1f4e79;color:#fff;border-color:#1f4e79}
    .gp-svg{padding:8px 10px 4px;background:#fff}
    .gp-edit{padding:8px 10px 10px;border-top:1px solid #eef2f7;background:#f8fafc;display:none}
    .gp-edit .row{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
    .gp-edit label{font-size:10.5px;color:#334155;font-weight:700}
    .gp-edit input{border:1px solid #cbd5e1;border-radius:7px;padding:5px 8px;font-size:11.5px;width:90px}
    .gp-edit .go{background:#16a34a;color:#fff;border:0;border-radius:7px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer}
    .gp-edit .no{background:#94a3b8;color:#fff;border:0;border-radius:7px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer}
    .gp-note{font-size:9.5px;color:#64748b;padding:4px 10px 8px;background:#f8fafc}
    .gp-dim{cursor:pointer}
    .gp-dim:hover{filter:brightness(.6)}
    .gp-fab{position:fixed;right:14px;bottom:14px;z-index:9989;background:#1f4e79;color:#fff;border:0;border-radius:50%;
      width:44px;height:44px;font-size:18px;cursor:pointer;box-shadow:0 6px 20px rgba(31,78,121,.4)}
    .gp-hid{display:none}
    @media print{
      .sisi,.panggung,.gp-wrap,.gp-fab,.atas .aksi,.atas .lencana,.alat,.legenda,.status-bar{display:none!important}
      .atas{display:flex;border-bottom:2px solid #1f4e79;padding:6px 0}
      .badan{display:block;height:auto!important;overflow:visible!important}
      .hasil{display:block!important;height:auto!important;max-height:none!important}
      .hasil .isi{max-height:none!important;overflow:visible!important}
      body,html{background:#fff!important;height:auto!important;overflow:visible!important}
    }
  `;
  document.head.appendChild(css);

  /* ---------- util input aplikasi ---------- */
  function barisByLabel(txt) {
    const rows = document.querySelectorAll(".baris");
    for (const r of rows) {
      const lb = r.querySelector("label");
      if (lb && lb.textContent.includes(txt)) return r;
    }
    return null;
  }
  function getVal(txt) {
    const r = barisByLabel(txt);
    if (!r) return null;
    const i = r.querySelector("input,select");
    return i ? (i.tagName === "SELECT" ? i.value : parseFloat(i.value)) : null;
  }
  function setVal(txt, v) {
    const r = barisByLabel(txt);
    if (!r) return false;
    const i = r.querySelector("input,select");
    if (!i) return false;
    i.value = v;
    i.dispatchEvent(new Event("input", { bubbles: true }));
    i.dispatchEvent(new Event("change", { bubbles: true }));
    return true;
  }
  function klikHitung() {
    const b = document.querySelector(".aksi.utama");
    if (b && !b.disabled) b.click();
    return !!(b && !b.disabled);
  }

  /* ---------- panel DOM ---------- */
  let notasiOn = true, panelOpen = true, editTarget = null;
  const wrap = document.createElement("div");
  wrap.className = "gp-wrap";
  wrap.innerHTML = `
    <div class="gp-head" id="gpHead"><b>GAMBAR PORTAL — NOTASI DIMENSI</b><span class="gp-x" id="gpToggle">▾</span></div>
    <div id="gpBody">
      <div class="gp-tools">
        <button id="gpNot" class="on">Notasi: ON</button>
        <button id="gpMode" class="on">Potongan Portal</button>
        <button id="gpRefresh">⟳ Sinkron</button>
      </div>
      <div class="gp-svg"><svg id="gpSvg" viewBox="0 0 320 240" style="width:100%"></svg></div>
      <div class="gp-edit" id="gpEdit">
        <b style="font-size:11px;color:#1f4e79" id="gpEditTitle">Edit Dimensi</b>
        <div class="row"><input id="gpEditVal" type="number" step="0.1"><button class="go" id="gpApply">Terapkan & Hitung</button><button class="no" id="gpCancel">Batal</button></div>
      </div>
      <div class="gp-note">Klik garis dimensi untuk mengubah nilai — otomatis sinkron ke analisis & hasil. Sudut atap memakai derajat (°).</div>
    </div>`;
  document.body.appendChild(wrap);
  const fab = document.createElement("button");
  fab.className = "gp-fab gp-hid"; fab.textContent = "📐"; fab.title = "Gambar Portal";
  document.body.appendChild(fab);

  /* ---------- gambar SVG ---------- */
  function line(x1, y1, x2, y2, cls, w) {
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}" stroke="${cls === "gp-dim" ? "#b45309" : "#1f4e79"}" stroke-width="${w || (cls === "gp-dim" ? 1.1 : 2.6)}" ${cls === "gp-dim" ? 'marker-start="url(#gpArrow)" marker-end="url(#gpArrow)"' : ""}/>`;
  }
  function dimText(x, y, t) {
    return `<text x="${x}" y="${y}" class="gp-dim" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309" font-family="Consolas">${t}</text>`;
  }
  function render(mode) {
    const P = getVal("Panjang") || 60, B = getVal("Bentang") || getVal("Lebar") || 24,
      dx = getVal("Jarak antar") || 6, h1 = getVal("Tinggi eave") || 8,
      alpha = getVal("Kemiringan") || 10;
    const rad = alpha * Math.PI / 180;
    const h2 = h1 + (B / 2) * Math.tan(rad);
    const svg = document.getElementById("gpSvg");
    let s = `<defs><marker id="gpArrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0.8 L3.5,3.5 L0,6.2" fill="none" stroke="#b45309" stroke-width="1"/></marker></defs>`;
    if (mode) { /* POTONGAN PORTAL (depan) */
      const ox = 170, oy = 178, sc = Math.min(1, 110 / (B / 2), 120 / h2);
      const xl = ox - (B / 2) * sc, xr = ox + (B / 2) * sc;
      const yG = oy, yE = oy - h1 * sc, yR = oy - h2 * sc;
      s += `<line x1="30" y1="${yG}" x2="310" y2="${yG}" stroke="#64748b" stroke-width="1.4"/>`;
      s += line(xl, yG, xl, yE) + line(xr, yG, xr, yE);
      s += line(xl, yE, ox, yR) + line(ox, yR, xr, yE);
      s += `<text x="${ox}" y="${yR - 6}" font-size="9" fill="#64748b" text-anchor="middle">▲ bubungan</text>`;
      if (notasiOn) {
        const yDim = yG + 22;
        s += line(xl, yDim, xr, yDim, "gp-dim");
        s += dimText(ox, yDim + 12, `BENTANG B = ${B.toFixed(1)} m`);
        const xd1 = xl - 30, xd2 = xl - 8;
        s += line(xd1, yG, xd1, yE, "gp-dim") + dimText(xd1 - 5, (yG + yE) / 2, `h eave = ${h1.toFixed(2)} m`);
        const xd3 = xr + 8, xd4 = xr + 30;
        s += line(xd3, yG, xd3, yR, "gp-dim") + dimText(xd4 + 5, (yG + yR) / 2, `h puncak = ${h2.toFixed(2)} m`);
        const ax = ox - 34 * Math.cos(rad), ay = yR + 34 * Math.sin(rad);
        s += `<path d="M ${ox} ${yR} A 34 34 0 0 1 ${ax} ${ay}" fill="none" stroke="#b45309" stroke-width="1.1"/>`;
        s += `<text x="${ox - 44}" y="${yR + 20}" font-size="10.5" font-weight="700" fill="#b45309" font-family="Consolas" class="gp-dim">α = ${alpha.toFixed(1)}°</text>`;
        s += `<rect x="${xl + 4}" y="${yE + 4}" width="8" height="5" fill="#fff" stroke="#1f4e79"/>`;
      }
      s += `<text x="32" y="222" font-size="9.5" fill="#334155" font-family="Segoe UI">POTONGAN PORTAL — ${B.toFixed(0)}×${P.toFixed(0)} m, ${alpha.toFixed(1)}°</text>`;
    } else { /* TAMPAK MEMANJANG (samping) */
      const ox = 24, oy = 168, sc = Math.min(1, 268 / P, 110 / h2);
      const ye = oy - h2 * sc;
      s += `<line x1="18" y1="${oy}" x2="300" y2="${oy}" stroke="#64748b" stroke-width="1.4"/>`;
      let n = Math.max(2, Math.round(P / dx));
      for (let k = 0; k < n; k++) {
        const x = ox + k * (P / (n - 1)) * sc;
        s += line(x, oy, x, ye);
      }
      s += line(ox, ye, ox + P * sc, ye);
      if (notasiOn) {
        const yDim = oy + 20;
        s += line(ox, yDim, ox + P * sc, yDim, "gp-dim");
        s += dimText(ox + (P * sc) / 2, yDim + 12, `PANJANG P = ${P.toFixed(1)} m`);
        s += line(ox, oy + 2, ox, oy + 2, "", 0);
        s += dimText(ox + 16, oy - 8, `@ ${dx.toFixed(1)} m × ${n} portal`);
        const xd3 = ox + P * sc + 8, xd4 = ox + P * sc + 30;
        s += line(xd3, oy, xd3, ye, "gp-dim") + dimText(xd4 + 4, (oy + ye) / 2, `h = ${h2.toFixed(2)} m`);
      }
      s += `<text x="26" y="222" font-size="9.5" fill="#334155" font-family="Segoe UI">TAMPAK MEMANJANG — ${n} portal @ ${dx.toFixed(1)} m</text>`;
    }
    svg.innerHTML = s;
    svg.querySelectorAll(".gp-dim").forEach(el => el.addEventListener("click", () => {
      const t = el.tagName === "text" ? el.textContent : "";
      if (t.includes("BENTANG")) openEdit("Bentang", B, "m");
      else if (t.includes("h eave")) openEdit("Tinggi eave", h1, "m");
      else if (t.includes("h puncak")) openEdit("Tinggi eave", h1, "m (naikkan eave / ubah α)");
      else if (t.includes("h =")) openEdit("Tinggi eave", h1, "m");
      else if (t.includes("α")) openEdit("Kemiringan", alpha, "°");
      else if (t.includes("PANJANG")) openEdit("Panjang", P, "m");
      else if (t.includes("@")) openEdit("Jarak antar", dx, "m");
    }));
  }

  /* ---------- edit dimensi → sinkron ---------- */
  const LMAP = { "Bentang": "Bentang rafter", "Tinggi eave": "Tinggi eave", "Kemiringan": "Kemiringan atap", "Panjang": "Panjang bangunan", "Jarak antar": "Jarak antar rafter" };
  function openEdit(key, cur, unit) {
    editTarget = key;
    document.getElementById("gpEditTitle").textContent = `Edit: ${key} (satuan ${unit}) — nilai saat ini ${cur}`;
    document.getElementById("gpEditVal").value = cur;
    document.getElementById("gpEdit").style.display = "block";
    document.getElementById("gpEditVal").focus();
  }
  document.getElementById("gpApply").addEventListener("click", () => {
    const v = parseFloat(document.getElementById("gpEditVal").value);
    if (!isNaN(v) && editTarget) { setVal(LMAP[editTarget], v); setTimeout(klikHitung, 120); }
    document.getElementById("gpEdit").style.display = "none";
  });
  document.getElementById("gpCancel").addEventListener("click", () => { document.getElementById("gpEdit").style.display = "none"; });

  /* ---------- toggle & interaksi ---------- */
  let modePotong = true;
  document.getElementById("gpHead").addEventListener("click", () => {
    panelOpen = !panelOpen;
    document.getElementById("gpBody").style.display = panelOpen ? "block" : "none";
    document.getElementById("gpToggle").textContent = panelOpen ? "▾" : "▸";
    fab.classList.toggle("gp-hid", panelOpen);
    wrap.style.display = "block";
  });
  fab.addEventListener("click", () => { panelOpen = true; document.getElementById("gpBody").style.display = "block"; document.getElementById("gpToggle").textContent = "▾"; fab.classList.add("gp-hid"); });
  document.getElementById("gpNot").addEventListener("click", function () {
    notasiOn = !notasiOn; this.textContent = "Notasi: " + (notasiOn ? "ON" : "OFF"); this.classList.toggle("on", notasiOn); render(modePotong);
  });
  document.getElementById("gpMode").addEventListener("click", function () {
    modePotong = !modePotong; this.textContent = modePotong ? "Potongan Portal" : "Tampak Memanjang"; render(modePotong);
  });
  document.getElementById("gpRefresh").addEventListener("click", () => render(modePotong));

  /* ---------- tombol PDF di toolbar ---------- */
  function addPdfButton() {
    const atas = document.querySelector(".atas");
    if (!atas || document.getElementById("gpPdfBtn")) return;
    const ref = [...atas.querySelectorAll(".aksi")].find(b => b.textContent.includes("Tabel .xlsx"));
    const btn = document.createElement("button");
    btn.id = "gpPdfBtn"; btn.className = "aksi"; btn.textContent = "Laporan PDF";
    btn.title = "Cetak laporan hasil analisis ke PDF (pilih Save as PDF)";
    btn.addEventListener("click", () => {
      const hasil = document.querySelector(".hasil");
      if (hasil && hasil.classList.contains("tutup")) {
        const openBtn = hasil.querySelector(".tab button:last-child");
        if (openBtn) openBtn.click();
      }
      setTimeout(() => window.print(), 250);
    });
    if (ref && ref.parentNode) ref.parentNode.insertBefore(btn, ref.nextSibling); else atas.appendChild(btn);
  }

  /* ---------- boot ---------- */
  let tries = 0;
  const iv = setInterval(() => {
    tries++;
    if (document.querySelector(".atas") && document.querySelector(".baris")) {
      clearInterval(iv);
      addPdfButton();
      render(true);
      let last = "";
      setInterval(() => {
        const sig = ["Panjang", "Bentang", "Lebar", "Jarak antar", "Tinggi eave", "Kemiringan"].map(getVal).join("|");
        if (sig !== last) { last = sig; render(modePotong); }
      }, 1200);
    } else if (tries > 120) clearInterval(iv);
  }, 500);
})();
</script>
</body>
