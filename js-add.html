function hitSambungan() {
  if (sbMode === "Beam") {
    const Mu = num("sbMu"), Vu = num("sbVu"), rows = Math.max(1, Math.round(num("sbRows"))), cols = Math.max(1, Math.round(num("sbCols")));
    const db = num("sbDia"), Fub = num("sbMutu"), p = num("sbP"), g = num("sbG"), tp = num("sbTp"), Fu = num("sbFu");
    const AB = { 20: 245, 22: 303, 24: 353, 27: 459 }[db];
    const n = rows * cols;
    const ys = []; for (let r = 1; r <= rows; r++) ys.push(p * ((rows + 1) / 2 - r));
    const Iy = ys.reduce((s, y) => s + y * y, 0);
    let Tmax = 0; ys.forEach(y => { const t = Mu * 1e6 * Math.max(0, y) / (cols * Iy); if (t > Tmax) Tmax = t; });
    const phiVn = 0.75 * 0.40 * Fub * AB;
    const phiTn = 0.75 * 0.75 * Fub * AB;
    const Vper = Vu * 1000 / n;
    const d1 = Vper / phiVn;
    const d2 = Tmax / phiTn;
    const d3 = Math.sqrt(d1 * d1 + d2 * d2);
    const phiBrn = 0.75 * 2.4 * Fu * db * tp;
    const d4 = Vper / phiBrn;
    const dc = Math.max(d1, d2, d3, d4);
    statusCard("sbRes", [
      { k: "D/C MAKSIMUM", v: dc.toFixed(3), s: dc <= 1 ? "AMAN (≤ 1,00)" : "TIDAK AMAN (> 1,00)", dc },
      { k: "Geser per baut", v: Vper.toFixed(0) + " N", s: "φRn = " + phiVn.toFixed(0) + " N · D/C " + d1.toFixed(2), dc: d1 },
      { k: "Tarik baris terluar", v: Tmax.toFixed(0) + " N/baut", s: "φTn = " + phiTn.toFixed(0) + " N · D/C " + d2.toFixed(2), dc: d2 },
      { k: "Interaksi geser+tarik", v: d3.toFixed(3), s: "√(dV²+dT²) ≤ 1,0", dc: d3 },
      { k: "Bearing end plate", v: d4.toFixed(2), s: "φRn = 0,75·2,4·Fu·db·tp", dc: d4 },
      { k: "Jumlah baut", v: n + " bh", s: "M" + db + " mutu " + (Fub === 600 ? "8.8" : "10.9") }
    ]);
    $("sbFormula").textContent =
      `TAHAP 1 — Grup baut elastik: T_baut = Mu·y_i / (n2·Σy_j²);  y = [${ys.map(y => y.toFixed(0)).join(", ")}] mm\n` +
      `TAHAP 2 — Geser: φVn = 0,75·(0,40·Fub·Ab) = 0,75×0,40×${Fub}×${AB} = ${phiVn.toFixed(0)} N; V/baut = ${Vper.toFixed(0)} N\n` +
      `TAHAP 3 — Tarik: φTn = 0,75·0,75·Fub·Ab = ${phiTn.toFixed(0)} N\n` +
      `TAHAP 4 — Interaksi: √(D/C geser² + D/C tarik²) = ${d3.toFixed(3)} ≤ 1,00\n` +
      `TAHAP 5 — Bearing pelat: φRn = 0,75·2,4·Fu·db·tp (SNI 1729:2020 Pasal J3.10)\n` +
      `Kesimpulan: D/C maks = ${dc.toFixed(3)} → ${dc <= 1 ? "SAMBUNGAN AMAN" : "PERBESAR baut/end plate"} · Referensi: SNI 1729:2020 Pasal J3 (baut), J3.10 (bearing)`;
  } else {
    const Pu = num("bpPu"), Mu = num("bpMu"), L = num("bpL"), B = num("bpB"), n = num("bpN"), db = num("bpDia");
    const Fub = num("bpMutu"), tp = num("bpTp"), d = num("bpD"), bf = num("bpBf"), fc = num("bpFc"), c = num("bpC");
    const AB = { 24: 353, 30: 561, 36: 817 }[db];
    const e = Mu * 1000 / Pu;
    const qmean = Pu * 1000 / (L * B);
    const rA = Math.min(2, Math.pow((L * B * 2.56) / (d * bf), 2)); rA2 = Math.min(2, rA);
    const qall = 0.65 * 0.85 * fc * Math.sqrt(rA2);
    let qmax = qmean * (1 + 6 * e / B), Ttot = 0, d1, d2;
    if (e <= B / 6) { d1 = qmax / qall; }
    else {
      const arm = (B - c) - B / 6;
      Ttot = Math.max(0, Pu * 1000 * (e - B / 6) / Math.max(1, arm));
      d1 = qall ? qmean / qall : 0;
    }
    const phiTn = 0.75 * 0.75 * Fub * AB;
    const Teach = Ttot / Math.max(1, n / 2);
    d2 = Teach / phiTn;
    const m = (B - bf) / 2;
    const M = qmax * m * m / 2;
    const treq = Math.sqrt(4 * M / (0.9 * 250));
    const d3 = tp / treq;
    const dc = Math.max(d1, d2, d3);
    statusCard("sbRes", [
      { k: "D/C MAKSIMUM", v: dc.toFixed(3), s: dc <= 1 ? "AMAN" : "TIDAK AMAN — perbesar", dc },
      { k: "Eksentrisitas e", v: e.toFixed(0) + " mm", s: e <= B / 6 ? "kompresi penuh (e ≤ B/6)" : "ada tarik angkur (e > B/6)" },
      { k: "Tekanan beton", v: qmax.toFixed(2) + " MPa", s: "φ·0,85·fc·√(A2/A1) = " + qall.toFixed(2) + " MPa · D/C " + d1.toFixed(2), dc: d1 },
      { k: "Tarik angkur", v: Ttot > 0 ? Teach.toFixed(0) + " N/angkur" : "—", s: "φNn = " + phiTn.toFixed(0) + " N · D/C " + d2.toFixed(2), dc: d2 },
      { k: "Tebal pelat", v: tp + "/" + treq.toFixed(1) + " mm", s: "konsol m = " + m.toFixed(0) + " mm · D/C " + d3.toFixed(2), dc: d3 },
      { k: "Angkur", v: n + " × M" + db, s: "mutu " + (Fub === 600 ? "8.8" : "5.6") }
    ]);
    $("sbFormula").textContent =
      `TAHAP 1 — e = Mu/Pu = ${e.toFixed(0)} mm ${e <= B / 6 ? "≤" : ">"} B/6 = ${(B / 6).toFixed(0)} mm\n` +

      `TAHAP 3 — Tarik angkur (e > B/6): T = Pu(e − B/6) / ((B − c) − B/6) = ${Ttot.toFixed(0)} N → per angkur ${Teach.toFixed(0)} N\n` +
      `TAHAP 4 — Tebal pelat: M = q·m²/2, m = (B − bf)/2 = ${m.toFixed(0)} mm → t = √(4M/(0,9·Fy)) = ${treq.toFixed(1)} mm (Fy = 250 MPa)\n` +
      `Kesimpulan: D/C maks = ${dc.toFixed(3)} → ${dc <= 1 ? "BASE PLATE AMAN" : "PERBESAR pelat/angkur"} · Referensi: AISC DG1 & SNI 2847:2019 (beton)`;

function hitSch() {
  const totB = schData.reduce((s, r) => s + r[3], 0);
  const W = Math.max(...schData.map(r => r[1] + r[2] - 1), 1);
  schW = W;
  const plan = []; let acc = 0;
  for (let w = 1; w <= W; w++) {
    let wk = 0;
    schData.forEach(r => { wk += Math.min(Math.max(0, (w - r[1] + 1) / r[2]), 1) * r[3]; });
    plan.push(totB > 0 ? wk / totB * 100 : 0);
  }
  const cur = Math.min(Math.max(1, Math.round(num("schCur"))), W);
  const act = Math.min(Math.max(0, num("schAct")), 100);
  const planAtCur = plan[cur - 1];
  const dev = act - planAtCur;
  // kurva S
  const X0 = 60, Y0 = 310, X1 = 740, Y1 = 40;
  const sx = w => X0 + (w - 1) / (W - 1) * (X1 - X0);
  const sy = v => Y0 - v / 100 * (Y0 - Y1);
  let grid = "";
  for (let g = 0; g <= 100; g += 20) grid += `<line x1="${X0}" y1="${sy(g)}" x2="${X1}" y2="${sy(g)}" stroke="#e2e8f0"/><text x="${X0 - 8}" y="${sy(g) + 3}" font-size="9" fill="#64748b" text-anchor="end">${g}%</text>`;
  for (let w = 1; w <= W; w += Math.max(1, Math.round(W / 12))) grid += `<text x="${sx(w)}" y="${Y0 + 16}" font-size="9" fill="#64748b" text-anchor="middle">mgg ${w}</text>`;
  const path = plan.map((v, i) => (i ? "L" : "M") + sx(i + 1).toFixed(1) + "," + sy(v).toFixed(1)).join(" ");
  $("sCurve").innerHTML = `<rect x="0" y="0" width="800" height="360" fill="#fff"/>${grid}
    <line x1="${X0}" y1="${Y0}" x2="${X0}" y2="${Y1}" stroke="#334155"/><line x1="${X0}" y1="${Y0}" x2="${X1}" y2="${Y0}" stroke="#334155"/>
    <path d="${path}" fill="none" stroke="#2563eb" stroke-width="2.4"/>
    <circle cx="${sx(cur)}" cy="${sy(act)}" r="6" fill="#b91c1c"/><text x="${sx(cur) + 8}" y="${sy(act) - 8}" font-size="10.5" fill="#b91c1c" font-weight="700">Aktual ${act.toFixed(0)}%</text>
    <line x1="${sx(cur)}" y1="${sy(act)}" x2="${sx(cur)}" y2="${Y0}" stroke="#b91c1c" stroke-dasharray="4 3" stroke-width="1"/>
    <text x="${X0 + (X1 - X0) / 2}" y="24" font-size="12.5" fill="#1f4e79" text-anchor="middle" font-weight="700">KURVA S — RENCANA (biru) vs AKTUAL (merah), durasi ${W} minggu</text>`;
  statusCard("schRes", [
    { k: "DURASI PROYEK", v: W + " minggu", s: schData.length + " item pekerjaan" },
    { k: "BOBOT TERJADWAL (mgg " + cur + ")", v: planAtCur.toFixed(1) + " %", s: "rencana kumulatif" },
    { k: "PROGRES AKTUAL", v: act.toFixed(0) + " %", s: "minggu ke-" + cur },
    { k: "DEVIASI", v: (dev >= 0 ? "+" : "") + dev.toFixed(1) + " %", s: dev >= 0 ? "DI DEPAN JADWAL" : "TERLAMBAT", dc: dev >= 0 ? 0 : 2 },
    { k: "TOTAL BOBOT", v: totB.toFixed(0) + " %", s: totB !== 100 ? "⚠ tidak 100% — sesuaikan" : "OK (100%)" }
  ]);
  schLast = { W, plan };
}
